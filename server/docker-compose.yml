# 自建示例：docker compose up -d
# 首次启动会创建管理员；密码在 `docker compose logs` 里（只显示一次），或用 GOKE_ADMIN_PASSWORD 指定。
# 对外请放在 HTTPS 反向代理（Caddy / Nginx）后面，并开启 GOKE_TRUST_PROXY=1。
services:
  goke:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      GOKE_ADMIN_USER: admin
      # GOKE_ADMIN_PASSWORD: 请改成自己的密码，不设置则随机生成
      # GOKE_TRUST_PROXY: "1"
    volumes:
      - goke-data:/data

volumes:
  goke-data:
