<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工课 · 管理后台</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main>
  <h1>工课 · 管理后台</h1>

  <section id="login" hidden>
    <form id="loginForm">
      <label>用户名 <input name="username" autocomplete="username" required></label>
      <label>密码 <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </section>

  <section id="panel" hidden>
    <header>
      <span>当前管理员：<b id="me"></b></span>
      <button id="logout" class="ghost">退出登录</button>
    </header>

    <h2>创建用户</h2>
    <form id="createForm" class="row">
      <input name="username" placeholder="用户名（3–32 位字母数字 _ . -）" required>
      <input name="password" type="password" placeholder="初始密码（至少 8 位）" autocomplete="new-password" required>
      <select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select>
      <button type="submit">创建</button>
    </form>

    <h2>用户</h2>
    <table>
      <thead><tr><th>用户名</th><th>角色</th><th>状态</th><th>设备</th><th>记录数</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="users"></tbody>
    </table>
    <p class="msg" id="msg"></p>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
