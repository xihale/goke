name: Release

# 正式发版时通过 ADAPTERS_SSH_KEY（Deploy Key）从私有仓库拉取 adapters/ 后由 CI 签名打包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (e.g. v0.0.1-beta.14)'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || '' }}

      - name: Check private adapters secret
        env:
          ADAPTERS_SSH_KEY: ${{ secrets.ADAPTERS_SSH_KEY }}
        run: |
          if [ -z "$ADAPTERS_SSH_KEY" ]; then
            echo "::error::缺少 ADAPTERS_SSH_KEY Secret，拒绝在缺失私有适配器的情况下构建发布包"
            exit 1
          fi

      - name: Checkout private adapters
        uses: actions/checkout@v7
        with:
          repository: xihale/goke-adapters
          ssh-key: ${{ secrets.ADAPTERS_SSH_KEY }}
          path: adapters

      - name: Verify private adapters mounted
        run: |
          if [ ! -f adapters/build.gradle.kts ]; then
            echo "::error::adapters/build.gradle.kts 缺失，私有适配器仓库检出异常"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check string resources and UI rules
        run: |
          python3 scripts/check_strings.py
          python3 scripts/check_ui_rules.py

      - name: Format and unit tests
        run: ./gradlew spotlessCheck :core:test :script:test :adapters:testDebugUnitTest :app:testDebugUnitTest --stacktrace

  build:
    runs-on: ubuntu-latest
    # 签名与私有适配器密钥存放在 release 环境
    environment: release
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      # fetch-depth: 0 拉全量历史和 tag，构建脚本用 git describe 派生版本号
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || '' }}
          fetch-depth: 0

      - name: Check private adapters secret
        env:
          ADAPTERS_SSH_KEY: ${{ secrets.ADAPTERS_SSH_KEY }}
        run: |
          if [ -z "$ADAPTERS_SSH_KEY" ]; then
            echo "::error::缺少 ADAPTERS_SSH_KEY Secret，拒绝在缺失私有适配器的情况下构建发布包"
            exit 1
          fi

      - name: Checkout private adapters
        uses: actions/checkout@v7
        with:
          repository: xihale/goke-adapters
          ssh-key: ${{ secrets.ADAPTERS_SSH_KEY }}
          path: adapters

      - name: Verify private adapters mounted
        run: |
          if [ ! -f adapters/build.gradle.kts ]; then
            echo "::error::adapters/build.gradle.kts 缺失，私有适配器仓库检出异常"
            exit 1
          fi

      - name: Extract release changelog
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          mkdir -p release-payload
          python3 scripts/extract_changelog.py "$TAG_NAME" \
            --changelog CHANGELOG.md \
            --allow-tag-fallback \
            --out release-payload/release_notes.md
          cat release-payload/release_notes.md

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check and decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD \
                      SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名 Secrets：${missing[*]}；release 构建不允许回退 debug 签名"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore 已写入 $RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release asset
        id: meta
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::缺少构建产物: $src"
            exit 1
          fi
          cp "$src" "release-payload/Goke-${VERSION}-arm64-v8a.apk"
          ls -lh "release-payload/Goke-${VERSION}-arm64-v8a.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive ProGuard mapping
        uses: actions/upload-artifact@v7
        with:
          name: goke-${{ steps.meta.outputs.version }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Upload release payload
        uses: actions/upload-artifact@v7
        with:
          name: release-payload
          path: release-payload
          retention-days: 1

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@v8
        with:
          name: release-payload
          path: release-payload

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          FLAGS=(--title "$TAG_NAME" --notes-file release-payload/release_notes.md)
          if [ "${{ needs.build.outputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-payload/Goke-*.apk --clobber
            gh release edit "$TAG_NAME" "${FLAGS[@]}"
          else
            gh release create "$TAG_NAME" release-payload/Goke-*.apk "${FLAGS[@]}"
          fi
