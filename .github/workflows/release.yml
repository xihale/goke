name: Release

# 正式发版时通过 ADAPTERS_SSH_KEY（Deploy Key）从私有仓库拉取 adapters/ 后由 CI 签名打包。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (e.g. v0.0.1-beta.14)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # 签名与私有适配器密钥存放在 release 环境
    environment: release
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 拉全量历史和 tag，构建脚本用 git describe 派生版本号
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || '' }}
          fetch-depth: 0

      - name: Check private adapters secret
        env:
          ADAPTERS_SSH_KEY: ${{ secrets.ADAPTERS_SSH_KEY }}
        run: |
          if [ -z "$ADAPTERS_SSH_KEY" ]; then
            echo "::error::缺少 ADAPTERS_SSH_KEY Secret，拒绝在缺失私有适配器的情况下构建发布包"
            exit 1
          fi

      - name: Checkout private adapters
        uses: actions/checkout@v4
        with:
          repository: xihale/goke-adapters
          ssh-key: ${{ secrets.ADAPTERS_SSH_KEY }}
          path: adapters

      - name: Verify private adapters mounted
        run: |
          if [ ! -f adapters/build.gradle.kts ]; then
            echo "::error::adapters/build.gradle.kts 缺失，私有适配器仓库检出异常"
            exit 1
          fi

      - name: Extract release changelog
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          python3 scripts/extract_changelog.py "$TAG_NAME" \
            --changelog CHANGELOG.md \
            --allow-tag-fallback \
            --out "${RUNNER_TEMP}/release_notes.md"
          cat "${RUNNER_TEMP}/release_notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check string resources
        run: python3 scripts/check_strings.py

      - name: Check UI rules
        run: python3 scripts/check_ui_rules.py

      - name: Format check
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew :core:test :script:test :adapters:testDebugUnitTest :app:testDebugUnitTest --stacktrace

      - name: Check and decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD \
                      SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名 Secrets：${missing[*]}；release 构建不允许回退 debug 签名"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore 已写入 $RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release asset
        id: meta
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::缺少构建产物: $src"
            exit 1
          fi
          cp "$src" "Goke-${VERSION}-arm64-v8a.apk"
          ls -lh "Goke-${VERSION}-arm64-v8a.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: goke-${{ steps.meta.outputs.version }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: Goke-*.apk
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ runner.temp }}/release_notes.md
          generate_release_notes: false
