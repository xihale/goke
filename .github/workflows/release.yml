name: Release

# 正式发版包包含未入库的私有 adapters/ 模块，由本地签名构建并发布；
# 仅保留手动触发用于无适配器开源骨架包验证，避免打 tag 时 CI 自动覆写正式 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (e.g. v0.0.1-beta.14)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # 签名 Secrets 存放在 release 环境，便于后续加保护规则
    environment: release
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 拉全量历史和 tag，构建脚本用 git describe 派生版本号
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Extract release changelog
        run: |
          python3 scripts/extract_changelog.py "${{ inputs.tag }}" \
            --changelog CHANGELOG.md \
            --allow-tag-fallback \
            --out "${RUNNER_TEMP}/release_notes.md"
          cat "${RUNNER_TEMP}/release_notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check string resources
        run: python3 scripts/check_strings.py

      - name: Format check
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew :core:test :script:test :app:testDebugUnitTest --stacktrace

      - name: Check and decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEYSTORE_PASSWORD \
                      SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少签名 Secrets：${missing[*]}；release 构建不允许回退 debug 签名"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore 已写入 $RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release asset
        id: meta
        run: |
          TAG_NAME="${{ inputs.tag }}"
          VERSION="${TAG_NAME#v}"
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "::error::缺少构建产物: $src"
            exit 1
          fi
          cp "$src" "Goke-${VERSION}-arm64-v8a.apk"
          ls -lh "Goke-${VERSION}-arm64-v8a.apk"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive ProGuard mapping
        uses: actions/upload-artifact@v4
        with:
          name: goke-${{ steps.meta.outputs.version }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: Goke-*.apk
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: ${{ runner.temp }}/release_notes.md
          generate_release_notes: false
