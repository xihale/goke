name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 拉全量历史和 tag，构建脚本用 git describe 派生版本号
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check string resources
        run: python3 scripts/check_strings.py

      - name: Format check
        run: ./gradlew spotlessCheck

      - name: Unit tests
        run: ./gradlew :core:test :script:test :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goke-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vet and test server & web
        working-directory: server
        run: |
          go vet ./...
          go test ./...
          node --test webtest/*.test.mjs
