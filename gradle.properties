android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
# Keep test/target APKs on device after connectedAndroidTest (avoids repeated Xiaomi USB install prompts)
android.injected.androidTest.leaveApksInstalledAfterRun=true
# :benchmark requires isDebuggable=true with isMinifyEnabled=true to profile R8-shrunk target builds
android.sync.suppressAgpWarnings=DEBUGGABLE_AND_MINIFIED_ENABLED,UNSUPPORTED_PROJECT_OPTION_USE
